# Ambiente del MLflow Project. Se usa cuando `mlflow run` crea su propio ambiente (es decir,
# sin --env-manager local). Las versiones fijas (==) se toman de requirements.txt, para que el
# proyecto y la instalacion del README usen exactamente las mismas, definidas en un solo lugar.
python: "3.14"
build_dependencies:
  - pip
dependencies:
  - -r requirements.txt
