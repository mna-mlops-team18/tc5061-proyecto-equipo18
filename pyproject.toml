[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tc5061_proyecto_equipo18"
version = "0.0.1"
description = "Mibici MLOps"
authors = [
  { name = "TEC MNA TC5061 Equipo 18" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["tc5061_proyecto_equipo18"]
include = ["pyproject.toml", "tc5061_proyecto_equipo18/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tc5061_proyecto_equipo18"]
force-sort-within-sections = true

